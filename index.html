<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP MARKET GLOBAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Manrope', sans-serif; background-color: #050505; color: #ffffff; }
        .gold-gradient { background: linear-gradient(135deg, #f2ca50 0%, #b8860b 100%); }
        .gold-text { background: linear-gradient(135deg, #f2ca50 0%, #b8860b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bento-card { background: #0a0a0a; border: 1px solid #1a1a1a; transition: all 0.3s ease; }
        .bento-card:active { transform: scale(0.98); border-color: #f2ca50; }
    </style>
</head>
<body class="pb-28">
    <header class="p-6 flex justify-between items-center bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="text-2xl font-black tracking-tighter gold-text">VIP MARKET</div>
        <div class="w-10 h-10 rounded-xl border border-white/10 flex items-center justify-center bg-white/5">
            <span class="material-symbols-rounded text-white text-xl">bolt</span>
        </div>
    </header>

    <main class="px-6 space-y-6 mt-4">
        <div class="p-8 rounded-[2.5rem] gold-gradient text-black">
            <h1 class="text-3xl font-black mb-1">بوابتك نحو النخبة</h1>
            <p class="opacity-90 font-bold text-sm uppercase">Elite Global Ecosystem</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <a href="trading" class="col-span-2 bento-card p-6 rounded-[2.5rem] flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-black">أكاديمية التداول</h3>
                    <p class="text-xs text-gray-500 font-bold">PRICE ACTION ACADEMY</p>
                </div>
                <span class="material-symbols-rounded text-4xl text-[#f2ca50]">monitoring</span>
            </a>

            <a href="earning" class="bento-card p-6 rounded-[2.5rem] flex flex-col justify-between h-44">
                <span class="material-symbols-rounded text-3xl text-[#f2ca50]">payments</span>
                <h3 class="font-black text-lg">الربح والخدمات</h3>
            </a>

            <a href="ai-tools" class="bento-card p-6 rounded-[2.5rem] flex flex-col justify-between h-44">
                <span class="material-symbols-rounded text-3xl text-[#f2ca50]">smart_toy</span>
                <h3 class="font-black text-lg">أدوات الذكاء</h3>
            </a>

            <a href="apps" class="col-span-2 bento-card p-6 rounded-[2.5rem] flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-white/5 flex items-center justify-center">
                    <span class="material-symbols-rounded text-3xl text-[#f2ca50]">widgets</span>
                </div>
                <div>
                    <h3 class="font-black">متجر التطبيقات</h3>
                    <p class="text-xs text-gray-500 font-bold uppercase">MIUI Solutions</p>
                </div>
            </a>
        </div>
    </main>

    <nav class="fixed bottom-6 left-6 right-6 bg-[#0a0a0a]/90 backdrop-blur-xl border border-white/10 h-16 rounded-[1.5rem] flex items-center justify-around z-50">
        <a href="/" class="text-[#f2ca50]"><span class="material-symbols-rounded">home</span></a>
        <a href="https://wa.me/967782138587" class="text-gray-500"><span class="material-symbols-rounded">chat</span></a>
    </nav>
</body>
</html>
